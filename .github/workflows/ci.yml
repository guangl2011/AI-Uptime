name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    # Job ids double as check names; the protect-main ruleset requires the
    # contexts "backend" and "frontend", so no display `name:` overrides here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend deps
        run: pip install -e '.[dev]'

      - name: Ruff
        run: ruff check src tests seed evals

      - name: Mypy
        run: mypy src evals

      - name: Pytest
        run: pytest -q

      # Eval gates run on every PR so ranking/exposure regressions surface
      # at review time; the report is uploaded even on gate failure.
      - name: Eval harness
        run: python -m evals --output-dir eval-results

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: eval-results/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
