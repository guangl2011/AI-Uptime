name: nightly-eval

# Nightly evaluation over the full canonical synthetic corpus, plus the
# simulation suite, the 1,000-seed invariant sweep, and the Sim M4
# forecast-under-dynamics seed sweep. Reports are uploaded as
# workflow artifacts per run (never committed to the repo) so metric drift is
# reviewable over time. Mirrors the eval + sim gates that run on every PR in
# ci.yml; this schedule exists for drift history and the plan's seed-count
# gate (push CI runs the Hypothesis property seeds only), not new coverage.
on:
  schedule:
    # 03:17 UTC daily — off the top of the hour to avoid runner contention.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend deps
        run: pip install -e '.[dev]'

      - name: Run evaluation harness
        run: python -m evals --output-dir eval-results

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: eval-results/

      - name: Run simulation suite
        run: python -m evals.sim --output-dir eval-results/sim

      - name: Upload sim report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-report-${{ github.run_id }}
          path: eval-results/sim/

      - name: Run invariant sweep (1,000 seeds)
        run: python -m evals.sim.invariant_sweep --output-dir eval-results/invariants

      - name: Upload invariant sweep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariant-sweep-report-${{ github.run_id }}
          path: eval-results/invariants/

      - name: Run forecast-under-dynamics seed sweep (Sim M4, 100 seeds)
        run: python -m evals.sim.forecast_dynamics --output-dir eval-results/forecast-dynamics

      - name: Upload forecast-dynamics report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-dynamics-report-${{ github.run_id }}
          path: eval-results/forecast-dynamics/
